<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="MementoOS">
  <!-- Favicon des Arbeitsbereichs. Dasselbe Zeichen, umgekehrter Grund:
       hier Void mit knochenfarbenem Zeichen, damit der Tab des
       Arbeitsbereichs vom Tab des Lendung unterscheidbar ist. Wer beides
       offen hat — und das ist der Normalfall — findet so den richtigen. -->
  <rect width="64" height="64" rx="13" fill="#0b0c0e"/>
  <g fill="#f2f2f2">
    <circle cx="24.2" cy="26.8" r="10.7"/>
    <circle cx="47.6" cy="26.8" r="10.7"/>
    <circle cx="35.9" cy="47.7" r="10.7"/>
  </g>
</svg>
